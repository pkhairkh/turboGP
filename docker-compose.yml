# Wave 11: docker-compose for turboGP development.
# Usage: docker-compose up
version: "3.9"

services:
  turbogp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    volumes:
      - ./data:/data
    environment:
      - RUST_LOG=info
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5432"
      - "--data-dir"
      - "/data"
      - "--auth"
      - "--max-connections"
      - "128"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "turbogp"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
