[package]
name = "turbogp"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["turboGP Contributors"]
license = "CCL-X-1.2"
description = "Instruction-first, memory-centric relational database engine. The kernel table is the moat."
readme = "README.md"
keywords = ["database", "kernel", "avx512", "memory-hierarchy", "oltp"]
categories = ["database-implementations"]

[lib]
name = "turbogp"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zero-copy / byte manipulation
bytemuck = { version = "1.14", features = ["derive"] }
# Memory-mapped I/O
memmap2 = "0.9"
# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Error handling
anyhow = "1"
thiserror = "1"
# Concurrency
rayon = "1"
parking_lot = "0.12"
crossbeam = "0.8"
# Binary serialization (Wave 4 — binary checkpoint format)
bincode = "1.3"
# Real Raft consensus (Wave 6 — HA replication). Disabled by default to
# avoid pulling in tokio unless the `raft` feature is enabled. The `serde`
# feature is required so that `LogId`, `Vote`, `Entry`, `StoredMembership`,
# and `SnapshotMeta` are (de)serializable — needed by the disk-backed
# `SledRaftStore` (Wave 2 of the Production Wiring Programme).
openraft = { version = "0.9", optional = true, features = ["serde"] }
# Persistent storage for the Raft log + state machine (Wave 2 of the
# Production Wiring Programme). Optional, pulled in only with the `raft`
# feature so default builds do not compile sled.
sled = { version = "0.34", optional = true }
# Global allocator — replaces glibc ptmalloc2 (50% of query time was in
# malloc_consolidate + free). mimalloc has thread-local heaps.
mimalloc = { version = "0.1", features = ["override"] }
# Fast hashing — replaces std SipHash (9% of Q21 time) with hardware AES.
# Used for all HashMap/HashSet in query_interpreter/ via type aliases.
ahash = "0.8"
# Per-query arena allocator (W5B) — eliminates malloc/free churn for
# intermediate allocations (join output, index lists, masks).
bumpalo = "3"
# CPU detection
raw-cpuid = "11.0"
# Logging
tracing = "0.1"
# Parquet reader (for loading benchmark data)
parquet = "55"
arrow = "55"
# libc bindings for mmap/madvise (ADR-009 huge pages)
libc = "0.2"
# PRNG for MCTS join ordering (ADR-019 Wave 15)
rand = "0.9"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
regex = "1.10"
rust_decimal = "1.36"
# Fast non-cryptographic hash (FxHashMap) — 1-instr multiply hash for
# trusted u64 keys; replaces ahash (~5 instr) in hot HashMap sites.
# Wave 1A: Q21 EXISTS maps, Q3 GROUP BY, col_map.
fxhash = "0.2.1"
# Portable SIMD wrappers (f64x8, u64x8) with safe fallback on non-AVX512.
# Wave 3: SIMD aggregation kernels.
wide = "0.7"
# SIMD-accelerated byte-level substring search (memmem::find). Wave 10-1:
# Q13 LIKE filter on 1.5M o_comment rows — replaces str::find + from_utf8
# validation with SIMD byte search, ~3-5 ms saved.
memchr = "2"
# Base64 encoding for the WAL SQL payload (Wave 51 fix). The previous
# ad-hoc `\\|` / `\\n` escaping was ambiguous: a SQL string containing
# the literal bytes `\n` could not be distinguished from a real newline
# on replay. Base64 sidesteps the problem entirely.
base64 = "0.22"
# Wave 65: SCRAM-SHA-256 authentication for pgwire. The server stores
# salted password hashes (PBKDF2-HMAC-SHA-256) and verifies the SCRAM
# client proof on each connection when auth_required = true.
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
# Wave 11: Binary crate CLI parsing + logging.
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
# tokio is needed by integration tests for the async server (Wave 2 server mode).
# Heavy benchmark baselines (DuckDB bundled C++, ClickHouse TCP client) were moved
# behind an optional `bench-external` feature flag so unit tests don't require
# compiling ~1 GB of C++ just to run `cargo test --lib`.
tokio = { version = "1", features = ["full"] }

[features]
default = []
# External benchmark baselines. Compile with `--features bench-external` to enable
# DuckDB (bundled libduckdb C++) and ClickHouse TCP client. Used by examples/bench_*.
bench-external = ["dep:duckdb", "dep:clickhouse"]
# HA replication via openraft (Wave 6). Enables the `openraft` dependency.
# Compile with `--features raft` to use real Raft consensus. The `raft`
# feature also pulls in `sled` for the disk-backed `SledRaftStore` (Wave 2
# of the Production Wiring Programme — persistent Raft storage).
raft = ["dep:openraft", "dep:sled"]

# Optional external benchmark deps (only resolved when `bench-external` is enabled).
[dependencies.duckdb]
version = "1.1"
features = ["bundled"]
optional = true

[dependencies.clickhouse]
version = "0.15"
features = ["rustls-tls"]
optional = true

[[bench]]
name = "throughput"
harness = false
path = "benches/throughput.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_kernels"
harness = false
path = "benches/bench_kernels.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_tpc_h"
harness = false
path = "benches/bench_tpc_h.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_sketches"
harness = false
path = "benches/bench_sketches.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_wcoj"
harness = false
path = "benches/bench_wcoj.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_cardinality"
harness = false
path = "benches/bench_cardinality.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_planner"
harness = false
path = "benches/bench_planner.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_eddy"
harness = false
path = "benches/bench_eddy.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_tensor"
harness = false
path = "benches/bench_tensor.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_3x_proof"
harness = false
path = "benches/bench_3x_proof.rs"
required-features = ["bench-external"]

[[bench]]
name = "bench_tpc_h_full"
harness = false
path = "benches/bench_tpc_h_full.rs"
required-features = ["bench-external"]

[[example]]
name = "bench_duckdb_inproc"
required-features = ["bench-external"]

[[example]]
name = "bench_clickhouse_inproc"
required-features = ["bench-external"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Wave 20: Changed from "abort" to "unwind" — with panic remediation
# largely complete, unwind provides graceful degradation for unexpected
# runtime panics instead of killing the server process.
panic = "unwind"
strip = "none"
debug = "line-tables-only"

[profile.bench]
opt-level = 3
lto = "thin"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"]

[dependencies.log]
version = "0.4"
