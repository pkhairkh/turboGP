apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: turbogp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.listenPort }}
              name: pgwire
          env:
            - name: TURBOGP_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: TURBOGP_LISTEN_PORT
              value: {{ .Values.config.listenPort | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            - name: RUST_BACKTRACE
              value: {{ .Values.config.rustBacktrace | quote }}
            - name: TURBOGP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: TURBOGP_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.config.listenPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.config.listenPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
