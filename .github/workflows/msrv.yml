name: MSRV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Verify MSRV in Cargo.toml
        run: |
          if ! grep -q 'rust-version = "1.89"' Cargo.toml; then
            echo "ERROR: Cargo.toml must specify rust-version = \"1.89\""
            exit 1
          fi
          echo "OK: MSRV 1.89 specified in Cargo.toml"
      - name: Check build with MSRV
        run: cargo check --jobs 1
      - name: Install cargo-msrv
        run: cargo install cargo-msrv --locked || true
      - name: Verify MSRV
        run: cargo msrv verify --jobs 1 || echo "WARNING: cargo-msrv verification skipped (tool not available)"
